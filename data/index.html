<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LoRa Network Control</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<nav>
  <h1>LoRa Network</h1>
  <div id="health-bar">
    <span id="health-status">Connecting...</span>
    <span id="clock"></span>
  </div>
</nav>
<main>
  <section id="summary">
    <h2>System Overview</h2>
    <div class="grid-3">
      <div class="card"><label>Uptime</label><span id="gw-uptime">--</span><span class="unit">s</span></div>
      <div class="card"><label>Free Heap</label><span id="gw-heap">--</span><span class="unit">KB</span></div>
      <div class="card"><label>WiFi RSSI</label><span id="gw-rssi">--</span><span class="unit">dBm</span></div>
    </div>
  </section>

  <section id="weather">
    <h2>Weather Station</h2>
    <div class="grid-3">
      <div class="card"><label>Rain</label><span id="rain">--</span><span class="unit">mm</span></div>
      <div class="card"><label>Wind</label><span id="wind">--</span><span class="unit">m/s</span></div>
      <div class="card"><label>Dir</label><span id="wind-dir">--</span><span class="unit">°</span></div>
    </div>
  </section>

  <section id="sensors">
    <h2>Sensor Monitoring</h2>
    <div id="sensor-cards"><div id="sensor-placeholder" class="empty-state"><span class="spinner"></span><br><br>Waiting for sensor data...</div></div>
  </section>

  <section id="actuators">
    <h2>Actuator Nodes</h2>
    <div id="actuator-cards"><div class="empty-state">No actuator data yet</div></div>
  </section>

  <section id="provisioning">
    <h2>Add Node</h2>
    <form id="provision-form">
      <select id="p-type" required>
        <option value="sensor">Sensor</option>
        <option value="actuator">Actuator</option>
      </select>
      <input type="text" id="p-id" placeholder="Node ID (hex, e.g. 0001)" maxlength="4" required>
      <input type="text" id="p-psk" placeholder="PSK (32 hex chars)" maxlength="32" required>
      <input type="text" id="p-alias" placeholder="Alias (optional)" maxlength="16">
      <button type="submit">Add Node</button>
    </form>
    <div id="provision-status"></div>
  </section>

  <section id="registered-nodes">
    <h2>Registered Nodes</h2>
    <table id="nodes-table">
      <thead><tr><th>ID</th><th>Status</th><th>Type</th><th>Alias</th><th>Seq</th><th>Auto</th><th>Thr</th><th></th></tr></thead>
      <tbody id="nodes-tbody"></tbody>
    </table>
  </section>

  <section id="ota">
    <h2>Firmware Update (OTA)</h2>
    <form id="ota-form" enctype="multipart/form-data">
      <input type="file" name="firmware" accept=".bin">
      <button type="submit">Upload &amp; Update</button>
    </form>
    <div id="ota-progress"></div>
  </section>

  <section>
    <button id="restart-btn" onclick="restartGw()">Restart Gateway</button>
  </section>

  <section id="log">
    <h2>Event Log</h2>
    <pre id="log-output"></pre>
  </section>
</main>
<div id="toast-container" class="toast-container"></div>
<script src="/app.js"></script>
</body>
</html>
