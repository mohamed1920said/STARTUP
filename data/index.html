<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LoRa Network Dashboard</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<nav>
  <h1>LoRa Network Control</h1>
  <span id="health-status">Connecting...</span>
</nav>
<main>
  <section id="weather">
    <h2>Weather Station</h2>
    <div class="grid-3">
      <div class="card"><label>Rain</label><span id="rain">--</span><small>mm</small></div>
      <div class="card"><label>Wind</label><span id="wind">--</span><small>m/s</small></div>
      <div class="card"><label>Dir</label><span id="wind-dir">--</span><small>°</small></div>
    </div>
  </section>

  <section id="sensors">
    <h2>Sensor Monitoring</h2>
    <div id="sensor-cards"><div id="sensor-placeholder" style="text-align:center;padding:3rem;color:#4a5466;font-size:.9rem">⏳ Waiting for sensor data...</div></div>
  </section>

  <section id="provisioning">
    <h2>Add Node</h2>
    <form id="provision-form">
      <select id="p-type" required>
        <option value="sensor">Sensor</option>
        <option value="actuator">Actuator</option>
      </select>
      <input type="text" id="p-id" placeholder="Node ID (hex, e.g. 0001)" maxlength="4" required>
      <input type="text" id="p-psk" placeholder="PSK (32 hex chars)" maxlength="32" required>
      <input type="text" id="p-alias" placeholder="Alias (optional)" maxlength="16">
      <button type="submit">Add Node</button>
    </form>
    <div id="provision-status"></div>
  </section>

  <section id="registered-nodes">
    <h2>Registered Nodes</h2>
    <table id="nodes-table">
      <thead><tr><th>ID</th><th>Status</th><th>Type</th><th>Alias</th><th>Seq</th><th></th></tr></thead>
      <tbody id="nodes-tbody"></tbody>
    </table>
  </section>

  <section id="actuators">
    <h2>Actuator Nodes</h2>
    <div id="actuator-cards"></div>
  </section>

  <section id="ota">
    <h2>Firmware Update (OTA)</h2>
    <form id="ota-form" enctype="multipart/form-data">
      <input type="file" name="firmware" accept=".bin">
      <button type="submit">Upload & Update</button>
    </form>
    <div id="ota-progress"></div>
  </section>

  <section id="log">
    <h2>Event Log</h2>
    <pre id="log-output"></pre>
  </section>
</main>
<script src="/app.js"></script>
</body>
</html>
