[platformio]
default_envs = central_gateway
description = LoRa Multi-Node Network — ESP32-S3 Central Gateway, Sensor Node, Actuator Node

[common]
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
board = esp32-s3-devkitc-1
board_build.flash_mode = dio
board_build.f_cpu = 240000000L
build_flags = -DCORE_DEBUG_LEVEL=3 -DLWIP_IPV6=0

[env:central_gateway]
platform = espressif32
framework = arduino
board = ${common.board}
board_build.flash_mode = dio
board_build.memory_type = qio_opi
board_build.f_cpu = ${common.board_build.f_cpu}
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_build.filesystem = littlefs
monitor_speed = ${common.monitor_speed}
monitor_filters = ${common.monitor_filters}
build_flags = ${common.build_flags} -DBOARD_HAS_PSRAM -DLORAGW
build_src_filter = +<*> -<sensor/> -<actuator/> -<test/>
lib_deps =
    jgromes/RadioLib @ ^6.0.0
    mlesniew/PicoMQTT @ ^1.3.0
    mathieucarbou/ESP Async WebServer @ ^3.0.0
    bblanchon/ArduinoJson @ ^7.0.0
    paulstoffregen/OneWire @ ^2.3.7
lib_ignore = ESP8266WiFi

[env:central_gateway_ttgo]
platform = espressif32
framework = arduino
board = ttgo-lora32-v21
board_build.partitions = default.csv
board_build.filesystem = littlefs
monitor_speed = ${common.monitor_speed}
monitor_filters = ${common.monitor_filters}
build_flags = -DCORE_DEBUG_LEVEL=3 -DLWIP_IPV6=0 -DTTGO_GATEWAY -DLORAGW
build_src_filter = +<*> -<sensor/> -<actuator/> -<test/>
lib_deps =
    mlesniew/PicoMQTT @ ^1.3.0
    mathieucarbou/ESP Async WebServer @ ^3.0.0
    bblanchon/ArduinoJson @ ^7.0.0
    paulstoffregen/OneWire @ ^2.3.7
    sandeepmistry/LoRa @ ^0.8.0
lib_ignore = ESP8266WiFi

[env:sensor_node]
platform = espressif32
framework = arduino
board = ttgo-lora32-v21
board_build.partitions = default.csv
monitor_speed = ${common.monitor_speed}
monitor_filters = ${common.monitor_filters}
build_flags = -DCORE_DEBUG_LEVEL=3 -DLWIP_IPV6=0 -DLORASENSOR
build_src_filter = +<*> -<central/> -<actuator/> -<test/>
lib_deps =
    jgromes/RadioLib @ ^6.0.0
    paulstoffregen/OneWire @ ^2.3.7
    milesburton/DallasTemperature @ ^3.11.0

[env:actuator_node]
platform = espressif32
framework = arduino
board = ttgo-lora32-v21
board_build.partitions = default.csv
monitor_speed = ${common.monitor_speed}
monitor_filters = ${common.monitor_filters}
build_flags = -DCORE_DEBUG_LEVEL=3 -DLWIP_IPV6=0 -DLORAACTUATOR
build_src_filter = +<*> -<central/> -<sensor/> -<test/>
lib_deps =
    jgromes/RadioLib @ ^6.0.0

[env:test_tx]
platform = espressif32
framework = arduino
board = ttgo-lora32-v21
board_build.partitions = default.csv
monitor_speed = ${common.monitor_speed}
monitor_filters = ${common.monitor_filters}
build_flags = -DTEST_MODE=1
build_src_filter = -<*> +<test/test_ttgo.cpp>
lib_deps =
    jgromes/RadioLib @ ^6.0.0

[env:test_rx]
platform = espressif32
framework = arduino
board = ttgo-lora32-v21
board_build.partitions = default.csv
monitor_speed = ${common.monitor_speed}
monitor_filters = ${common.monitor_filters}
build_flags = -DTEST_MODE=0
build_src_filter = -<*> +<test/test_ttgo.cpp>
lib_deps =
    sandeepmistry/LoRa @ ^0.8.0

