[platformio]
default_envs = central_gateway
description = LoRa Multi-Node Network — ESP32-S3 Central Gateway, Sensor Node, Actuator Node

[common]
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
board = esp32-s3-devkitc-1
board_build.flash_mode = dio
board_build.f_cpu = 240000000L
build_flags = -DCORE_DEBUG_LEVEL=3

[env:central_gateway]
platform = espressif32 @ 7.0.1
framework = arduino
board = ${common.board}
board_build.flash_mode = dio
board_build.f_cpu = ${common.board_build.f_cpu}
board_build.partitions = partitions_8MB.csv
board_build.filesystem = littlefs
monitor_speed = ${common.monitor_speed}
monitor_filters = ${common.monitor_filters}
build_flags =
    ${common.build_flags}
    -DLORAGW
    -DEDGE_AI_ALLOW_CONTROL=0
    -DPILOT_MAX_OPEN_S=300
    -DPILOT_REQUIRE_FEEDBACK_FOR_AUTO_OPEN=1
    -DPILOT_REQUIRE_MANUAL_REARM=1
    -DPILOT_ENABLE_LOCAL_MQTT=0
    -DPILOT_ENABLE_WEB_OTA=0
    -DPILOT_ENABLE_CLOUD_OPEN=0
build_src_filter = +<*> -<sensor/> -<actuator/>
lib_deps =
    jgromes/RadioLib @ 6.6.0
    mlesniew/PicoMQTT @ 1.3.0
    mathieucarbou/ESP Async WebServer @ 3.0.6
    bblanchon/ArduinoJson @ 7.4.3
    adafruit/DHT sensor library @ 1.4.7
    adafruit/Adafruit BMP280 Library @ 2.6.8
    adafruit/Adafruit Unified Sensor @ 1.1.15
lib_ignore = ESP8266WiFi

[env:sensor_node]
platform = espressif32 @ 7.0.1
framework = arduino
board = ttgo-lora32-v21
board_build.partitions = default.csv
monitor_speed = ${common.monitor_speed}
monitor_filters = ${common.monitor_filters}
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DLORASENSOR
    -DSENSOR_DEEP_SLEEP=1
build_src_filter = +<*> -<central/> -<actuator/>
lib_deps =
    jgromes/RadioLib @ 6.6.0
    paulstoffregen/OneWire @ 2.3.8
    milesburton/DallasTemperature @ 3.11.0

[env:actuator_node]
platform = espressif32 @ 7.0.1
framework = arduino
board = ttgo-lora32-v21
board_build.partitions = default.csv
monitor_speed = ${common.monitor_speed}
monitor_filters = ${common.monitor_filters}
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DLORAACTUATOR
    -DPILOT_MAX_OPEN_S=300
    -DPILOT_MIN_OPEN_BATTERY_MV=3400
build_src_filter = +<*> -<central/> -<sensor/>
lib_deps =
    jgromes/RadioLib @ 6.6.0
